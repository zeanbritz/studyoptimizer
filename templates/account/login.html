<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log in - StudyOptimizer</title>

    <style>
        :root {
            --ink: #2f373b;
            --muted: #68757b;
            --page: #edf1f3;
            --navy: #303a5a;
            --navy-light: #485676;
            --navy-dark: #222b45;
            --green: #58b82a;
            --green-dark: #3f8f1d;
            --danger: #a93636;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 24px;
            background: var(--page);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .login-shell {
            width: min(460px, 100%);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            color: var(--navy);
            font-size: 19px;
            font-weight: 900;
            letter-spacing: -0.45px;
            text-decoration: none;
        }

        .brand-mark {
            width: 37px;
            height: 37px;
            display: grid;
            place-items: center;
            border: 2px solid var(--green-dark);
            border-bottom-width: 4px;
            border-radius: 10px;
            background: var(--green);
            color: #ffffff;
        }

        .login-card {
            overflow: hidden;
            border: 1px solid #d8e0e3;
            border-bottom: 5px solid #c4cfd4;
            border-radius: 17px;
            background: #ffffff;
            box-shadow: 0 12px 34px rgba(35, 45, 70, 0.1);
        }

        .login-header {
            padding: 25px 27px;
            border-bottom: 5px solid var(--navy-dark);
            background: linear-gradient(
                135deg,
                var(--navy),
                var(--navy-light)
            );
        }

        .login-header h1 {
            margin: 0 0 6px;
            color: #ffffff;
            font-size: 29px;
            font-weight: 900;
            letter-spacing: -0.7px;
        }

        .login-header p {
            margin: 0;
            color: #d8dfed;
            font-size: 14px;
            font-weight: 600;
        }

        .login-form {
            padding: 25px 27px 27px;
        }

        .field {
            display: block;
            margin-bottom: 16px;
        }

        .field-label {
            display: block;
            margin: 0 0 7px 2px;
            color: #4d5a60;
            font-size: 12px;
            font-weight: 850;
        }

        .field input {
            width: 100%;
            min-height: 48px;
            padding: 10px 13px 9px;
            border: 2px solid #d0dade;
            border-bottom-width: 4px;
            border-radius: 11px;
            background: #f9fbfc;
            color: var(--ink);
            font-size: 15px;
            font-weight: 700;
            outline: none;
        }

        .field input:focus {
            border-color: #78b8dd;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(39, 143, 211, 0.12);
        }

        .errorlist,
        .login-error {
            margin: 0 0 15px;
            padding: 10px 12px;
            border: 1px solid #e4adad;
            border-radius: 9px;
            background: #fff2f2;
            color: var(--danger);
            font-size: 12px;
            font-weight: 750;
            list-style: none;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin: 3px 0 18px;
        }

        .remember-option {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 750;
        }

        .remember-option input {
            width: 16px;
            height: 16px;
            accent-color: var(--green-dark);
        }

        .forgot-link {
            color: #176f9f;
            font-size: 12px;
            font-weight: 850;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            min-height: 49px;
            padding: 11px 18px 9px;
            border: 2px solid var(--green-dark);
            border-bottom-width: 5px;
            border-radius: 12px;
            background: var(--green);
            color: #ffffff;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
        }

        .login-button:hover {
            background: #65c936;
            transform: translateY(-1px);
        }

        .login-button:active {
            border-bottom-width: 2px;
            transform: translateY(2px);
        }

        .register-link {
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 13px;
            font-weight: 650;
            text-align: center;
        }

        .register-link a {
            color: #176f9f;
            font-weight: 850;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 520px) {
            body {
                padding: 16px;
            }

            .login-header,
            .login-form {
                padding-right: 20px;
                padding-left: 20px;
            }

            .form-options {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="login-shell">

        <a href="{% url 'landing' %}" class="brand">
            <span class="brand-mark" aria-hidden="true">S</span>
            <span>StudyOptimizer</span>
        </a>

        <main class="login-card">

            <header class="login-header">
                <h1>Welcome back</h1>
                <p>Log in to continue to your study dashboard.</p>
            </header>

            <form
                method="post"
                action="{% url 'login' %}"
                class="login-form"
            >
                {% csrf_token %}

                {% if form.non_field_errors %}
                    <div class="login-error" role="alert">
                        {{ form.non_field_errors }}
                    </div>
                {% endif %}

                <label
                    class="field"
                    for="{{ form.login.id_for_label }}"
                >
                    <span class="field-label">
                        Username or email
                    </span>

                    {{ form.login }}
                    {{ form.login.errors }}
                </label>

                <label
                    class="field"
                    for="{{ form.password.id_for_label }}"
                >
                    <span class="field-label">
                        Password
                    </span>

                    {{ form.password }}
                    {{ form.password.errors }}
                </label>

                <div class="form-options">

                    {% if form.remember %}
                        <label class="remember-option">
                            {{ form.remember }}
                            <span>Remember me</span>
                        </label>
                    {% endif %}

                    <a
                        href="{% url 'account_reset_password' %}"
                        class="forgot-link"
                    >
                        Forgot password?
                    </a>

                </div>

                {% if redirect_field_value %}
                    <input
                        type="hidden"
                        name="{{ redirect_field_name }}"
                        value="{{ redirect_field_value }}"
                    >
                {% endif %}

                <button type="submit" class="login-button">
                    Log in
                </button>

                <p class="register-link">
                    Don’t have an account?
                    <a href="{% url 'register' %}">
                        Create one
                    </a>
                </p>

            </form>

        </main>

    </div>
</body>

</html>
