<section id="today-plan-garden" class="study-garden" role="tabpanel" aria-labelledby="plan-garden-tab" hidden>
    <div class="garden-intro">
        <div><span class="garden-eyebrow">A little progress, a little growth</span><h3>Your work, taking root.</h3></div>
        <div class="garden-motion-settings">
            <label class="garden-motion-control" for="garden-motion">Motion
                <select id="garden-motion" aria-describedby="garden-motion-hint">
                    <option value="auto">Device setting</option>
                    <option value="on">On</option>
                    <option value="off">Off</option>
                </select>
            </label>
            <p id="garden-motion-hint" class="garden-motion-hint" aria-live="polite" hidden>Your device reduces motion. Choose On to animate this garden.</p>
        </div>
    </div>
    <div class="garden-legend" aria-label="Garden key">
        <span><i class="legend-leaf" aria-hidden="true"></i>Subject to review</span>
        <span><i class="legend-tree" aria-hidden="true"></i>Pages summarized</span>
        <span><i class="legend-exam" aria-hidden="true"></i>Exam</span>
        <span><i class="legend-assessment" aria-hidden="true"></i>Assessment</span>
    </div>
    <div class="garden-soil" id="garden-scene" aria-label="Your study garden">
        <div class="garden-loading">Your garden is taking root…</div>
    </div>
    <div class="garden-bottom"><span id="garden-sync-status" role="status" aria-live="polite"></span></div>
    <div class="garden-popover" id="garden-popover" hidden role="region" aria-label="Garden item details">
        <button type="button" class="garden-popover-close" aria-label="Close garden details">×</button>
        <span class="garden-popover-kicker"></span><h4></h4><p></p><a class="garden-popover-link" href="#"></a>
    </div>
    <noscript><p>Use Standard view to open all your study tasks.</p></noscript>
</section>
