{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Create Formula - StudyOptimizer
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/formula-editor.css' %}"
    >

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #f5f6f8;

            color: #222;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

        }


        .page {

            min-height: 100vh;

            padding:
                40px
                20px
                60px;

        }


        .container {

            max-width: 900px;

            margin: 0 auto;

        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            display: flex;

            align-items: center;

            gap: 18px;

            margin-bottom: 30px;

        }


        .back-button {

            width: 40px;

            height: 40px;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                1px solid
                #dedede;

            border-radius: 9px;

            background: white;

            color: #333;

            text-decoration: none;

            font-size: 20px;

            flex-shrink: 0;

        }


        .back-button:hover {

            background: #f0f0f0;

        }


        .header-text h1 {

            margin:
                0
                0
                5px;

            font-size: 30px;

            letter-spacing: -0.6px;

        }


        .header-text p {

            margin: 0;

            color: #777;

            font-size: 14px;

        }


        /* =========================================
           CARD
        ========================================= */

        .card {

            background: white;

            border:
                1px solid
                #e5e5e5;

            border-radius: 14px;

            padding: 30px;

        }


        /* =========================================
           FORM
        ========================================= */

        .form-fields {

            margin-bottom: 30px;

        }


        /* =========================================
           FORMULA BUILDER
        ========================================= */

        .builder-header {

            margin-bottom: 20px;

            padding-top: 5px;

        }


        .builder-header h2 {

            margin:
                0
                0
                5px;

            font-size: 21px;

        }


        .builder-header p {

            margin: 0;

            color: #888;

            font-size: 13px;

        }


        .toolbar {

            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 20px;

        }


        .toolbar button,
        .toolbar select {

            min-height: 40px;

            padding:
                9px
                13px;

            border:
                1px solid
                #d8d8d8;

            border-radius: 8px;

            background: white;

            color: #333;

            font-family: inherit;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

        }


        .toolbar button:hover,
        .toolbar select:hover {

            background: #f5f5f5;

            border-color: #c8c8c8;

        }


        /* =========================================
           FORMULA CANVAS
        ========================================= */

        #formula-canvas {

            min-height: 180px;

            padding: 20px;

            border:
                1px solid
                #e1e1e1;

            border-radius: 10px;

            background: #fafafa;

            margin-bottom: 25px;

        }


        /* =========================================
           FOOTER
        ========================================= */

        .form-footer {

            display: flex;

            align-items: center;

            justify-content: flex-end;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 25px;

            padding-top: 22px;

            border-top:
                1px solid
                #eeeeee;

        }


        .footer-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 42px;

            padding:
                10px
                18px;

            border:
                1px solid
                #d8d8d8;

            border-radius: 8px;

            background: white;

            color: #444;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                transform 0.15s ease;

        }


        .footer-button:hover {

            background: #f5f5f5;

            border-color: #c5c5c5;

            transform:
                translateY(-1px);

        }


        .save-button {

            border: none;

            background: #222;

            color: white;

        }


        .save-button:hover {

            background: #333;

            border-color: #333;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .page {

                padding:
                    25px
                    15px
                    40px;

            }


            .card {

                padding: 20px;

            }


            .header-text h1 {

                font-size: 24px;

            }


            .toolbar {

                flex-direction: column;

                align-items: stretch;

            }


            .toolbar button,
            .toolbar select {

                width: 100%;

            }


            .form-footer {

                flex-direction: column;

                align-items: stretch;

            }


            .footer-button {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<div class="page">


    <div class="container">


        <!-- =========================================
             HEADER
        ========================================= -->

        <header class="header">


            <a
                href="{% url 'subject_detail' subject_index=subject_index %}"
                class="back-button"
            >
                ←
            </a>


            <div class="header-text">

                <h1>
                    Create Formula
                </h1>

                <p>
                    Add an important formula to {{ subject.name }}.
                </p>

            </div>


        </header>


        <!-- =========================================
             MAIN CARD
        ========================================= -->

        <div class="card">


            <form method="post">

                {% csrf_token %}


                <!-- =====================================
                     FORM FIELDS
                ====================================== -->

                <div class="form-fields">

                    {{ form.as_p }}

                </div>


                <!-- =====================================
                     FORMULA STRUCTURE
                ====================================== -->

                <input
                    type="hidden"
                    name="formula_structure"
                    id="formula-structure"
                    value="[]"
                >


                <!-- =====================================
                     FORMULA BUILDER
                ====================================== -->

                <div class="builder-header">

                    <h2>
                        Build your formula
                    </h2>

                    <p>
                        Add variables, numbers, operators, symbols, and fractions.
                    </p>

                </div>


                <div class="toolbar">


                    <button
                        type="button"
                        onclick="addElement('variable')"
                    >
                        + Variable
                    </button>


                    <button
                        type="button"
                        onclick="addElement('number')"
                    >
                        + Number
                    </button>


                    <select id="operator-select">

                        <option value="">
                            + Operator
                        </option>

                        <option value="+">
                            +
                        </option>

                        <option value="-">
                            −
                        </option>

                        <option value="×">
                            ×
                        </option>

                        <option value="÷">
                            ÷
                        </option>

                        <option value="=">
                            =
                        </option>

                        <option value="<">
                            &lt;
                        </option>

                        <option value=">">
                            &gt;
                        </option>

                    </select>


                    <button
                        type="button"
                        onclick="addSelectedOperator()"
                    >
                        Add
                    </button>


                    <button
                        type="button"
                        onclick="addElement('symbol', '(')"
                    >
                        + Symbol
                    </button>


                    <button
                        type="button"
                        onclick="addFraction()"
                    >
                        + Fraction
                    </button>


                </div>


                <!-- =====================================
                     CANVAS
                ====================================== -->

                <div id="formula-canvas">

                </div>


                <!-- =====================================
                     FOOTER
                ====================================== -->

                <div class="form-footer">


                    <a
                        href="{% url 'subject_detail' subject_index=subject_index %}"
                        class="footer-button"
                    >
                        Cancel
                    </a>


                    <a
                        href="{% url 'formula_list' subject_id=subject.id %}?subject_index={{ subject_index }}"
                        class="footer-button"
                    >
                        View All Formulas
                    </a>


                    <button
                        type="submit"
                        class="footer-button save-button"
                    >
                        Save Formula
                    </button>


                </div>


            </form>


        </div>


    </div>


</div>


<script src="{% static 'js/formula-editor.js' %}"></script>


</body>

</html>
