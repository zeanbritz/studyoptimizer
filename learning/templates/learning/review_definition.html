<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Review Definition</title>

    <style>

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f5f6f8;

            margin: 0;

            padding: 40px;
        }

        .container {

            max-width: 700px;

            margin: 0 auto;

            background: white;

            border: 1px solid #e5e5e5;

            border-radius: 14px;

            padding: 35px;

        }

        h1 {
            margin-top: 0;
        }

        .term {

            font-size: 28px;

            font-weight: 700;

            margin-bottom: 25px;

        }

        .definition {

            padding: 20px;

            background: #f7f7f7;

            border-radius: 10px;

            margin-bottom: 30px;

            line-height: 1.6;

        }

        .buttons {

            display: flex;

            gap: 15px;

        }

        button {

            flex: 1;

            padding: 14px;

            border: none;

            border-radius: 8px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

        }

        .wrong {
            background: #eee;
        }

        .correct {
            background: #222;

            color: white;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        Review Definition
    </h1>

    <div class="term">

        {{ definition.term }}

    </div>

    <div class="definition">

        {{ definition.definition }}

    </div>

    <form method="post">

        {% csrf_token %}

        <div class="buttons">

            <button
                type="submit"
                name="result"
                value="incorrect"
                class="wrong"
            >
                I didn't know
            </button>

            <button
                type="submit"
                name="result"
                value="correct"
                class="correct"
            >
                I knew it
            </button>

        </div>

    </form>

</div>

</body>

</html>
