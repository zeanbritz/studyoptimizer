{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Definition - StudyOptimizer</title>

    <link
        rel="stylesheet"
        href="{% static 'dashboard/css/sidebar.css' %}"
    >

    <style>
        :root {
            --ink: #2f3335;
            --muted: #687278;
            --page-background: #edf1f3;
            --surface-border: #d8e0e3;
            --surface-edge: #c4cfd4;
            --navy: #303a5a;
            --navy-dark: #222b45;
            --blue: #278fd3;
            --blue-dark: #176f9f;
            --blue-soft: #eaf5fc;
            --green: #58b82a;
            --green-dark: #3f8f1d;
            --danger: #d65454;
            --danger-dark: #a93636;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--page-background);
            color: var(--ink);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        .main {
            min-width: 0;
            flex: 1;
        }

        .page {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 40px 56px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 18px;
            padding: 25px 27px;
            border: 1px solid #465270;
            border-bottom: 5px solid var(--navy-dark);
            border-radius: 17px;
            background: linear-gradient(135deg, var(--navy) 0%, #485676 100%);
            box-shadow: 0 9px 24px rgba(35, 45, 70, 0.12);
        }

        .header-content {
            min-width: 0;
        }

        .eyebrow {
            display: block;
            margin-bottom: 7px;
            color: #aebfdf;
            font-size: 11px;
            font-weight: 850;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .header-content h1 {
            margin: 0 0 6px;
            color: #ffffff;
            font-size: 31px;
            font-weight: 850;
            letter-spacing: -0.7px;
            line-height: 1.15;
        }

        .header-content p {
            margin: 0;
            color: #d8dfed;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
        }

        .back-button {
            min-height: 43px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 9px 16px 7px;
            border: 2px solid #a8d3ec;
            border-bottom-width: 4px;
            border-radius: 11px;
            background: #edf8ff;
            color: var(--blue-dark);
            font-size: 13px;
            font-weight: 850;
            text-decoration: none;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .back-button:hover {
            background: #dff2ff;
            transform: translateY(-1px);
        }

        .back-button:active {
            border-bottom-width: 2px;
            transform: translateY(2px);
        }

        .editor-card {
            overflow: hidden;
            padding: 22px;
            border: 1px solid var(--surface-border);
            border-top: 3px solid var(--blue);
            border-bottom: 4px solid var(--surface-edge);
            border-radius: 15px;
            background: #f8fafb;
        }

        .card-heading {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 17px;
            border-bottom: 1px solid #dfe5e7;
        }

        .definition-icon {
            width: 42px;
            height: 42px;
            display: grid;
            flex: 0 0 42px;
            place-items: center;
            border: 1px solid #c9dfec;
            border-bottom: 3px solid #a8d3ec;
            border-radius: 11px;
            background: var(--blue-soft);
            color: var(--blue-dark);
        }

        .definition-icon svg {
            width: 23px;
            height: 23px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2;
        }

        .card-heading h2 {
            margin: 0 0 3px;
            color: #34393b;
            font-size: 17px;
            font-weight: 900;
        }

        .card-heading p {
            margin: 0;
            color: var(--muted);
            font-size: 11px;
            font-weight: 650;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .field {
            min-width: 0;
        }

        .field.term-field,
        .field.definition-field {
            grid-column: 1 / -1;
        }

        .field label {
            display: block;
            margin: 0 0 7px 2px;
            color: #5e686d;
            font-size: 12px;
            font-weight: 850;
        }

        .field input,
        .field textarea {
            width: 100%;
            border: 2px solid #d4dce0;
            border-bottom-width: 4px;
            border-radius: 11px;
            background: #ffffff;
            color: var(--ink);
            font-size: 14px;
            font-weight: 650;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .field input {
            min-height: 49px;
            padding: 10px 13px 9px;
        }

        .term-field input {
            color: #34393b;
            font-size: 16px;
            font-weight: 850;
        }

        .field textarea {
            min-height: 210px;
            padding: 13px 14px 12px;
            line-height: 1.6;
            resize: vertical;
        }

        .field input:hover,
        .field textarea:hover {
            border-color: #c4cfd4;
        }

        .field input:focus,
        .field textarea:focus {
            border-color: #78b8dd;
            box-shadow: 0 0 0 4px rgba(39, 143, 211, 0.12);
        }

        .help-text {
            margin: 6px 2px 0;
            color: #7a858a;
            font-size: 10px;
            font-weight: 650;
            line-height: 1.45;
        }

        .error-message {
            grid-column: 1 / -1;
            margin: 0;
            padding: 10px 12px;
            border: 1px solid #e6b6b6;
            border-bottom: 3px solid #d79999;
            border-radius: 9px;
            background: #fff2f2;
            color: var(--danger-dark);
            font-size: 12px;
            font-weight: 750;
        }

        .form-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #dfe5e7;
        }

        .cancel-button,
        .save-button {
            min-height: 43px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 17px 7px;
            border: 2px solid;
            border-bottom-width: 4px;
            border-radius: 11px;
            font-size: 13px;
            font-weight: 850;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .cancel-button {
            border-color: #cbd4d8;
            background: #ffffff;
            color: #5f696e;
        }

        .save-button {
            border-color: var(--green-dark);
            background: var(--green);
            color: #ffffff;
        }

        .cancel-button:hover {
            background: #f1f4f5;
        }

        .save-button:hover {
            background: #65c936;
        }

        .cancel-button:active,
        .save-button:active {
            border-bottom-width: 2px;
            transform: translateY(2px);
        }

        .back-button:focus-visible,
        .field input:focus-visible,
        .field textarea:focus-visible,
        .cancel-button:focus-visible,
        .save-button:focus-visible {
            outline: 3px solid rgba(39, 143, 211, 0.28);
            outline-offset: 3px;
        }

        @media (max-width: 700px) {
            .page {
                padding: 20px 18px 42px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
                padding: 22px 20px;
            }

            .header-content h1 {
                font-size: 27px;
            }

            .back-button {
                width: 100%;
            }

            .editor-card {
                padding: 18px;
            }
        }

        @media (max-width: 560px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.term-field,
            .field.definition-field {
                grid-column: auto;
            }

            .form-footer {
                flex-direction: column-reverse;
            }

            .cancel-button,
            .save-button {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .back-button,
            .field input,
            .field textarea,
            .cancel-button,
            .save-button {
                transition: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    {% include 'partials/sidebar.html' with active_page='summarize' %}

    <main class="main">

        <div class="page">

            <header class="page-header">
                <div class="header-content">
                    <span class="eyebrow">Definition editor</span>
                    <h1>Edit Definition</h1>
                    <p>{{ subject.name }}</p>
                </div>

                <a
                    href="{% url 'definition_list' subject_id=subject.id %}"
                    class="back-button"
                >
                    ← Back to Definitions
                </a>
            </header>

            <section class="editor-card">

                <div class="card-heading">
                    <span class="definition-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11a1 1 0 0 1 1 1v17a3 3 0 0 0-3-3H4Z"></path>
                            <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13a1 1 0 0 0-1 1v17a3 3 0 0 1 3-3h5Z"></path>
                        </svg>
                    </span>
                    <div>
                        <h2>Definition details</h2>
                        <p>Update the term and its review settings.</p>
                    </div>
                </div>

                <form method="POST">
                    {% csrf_token %}

                    <div class="form-grid">

                        <div class="field term-field">
                            <label for="id_term">Term</label>
                            <input
                                type="text"
                                id="id_term"
                                name="term"
                                value="{{ definition.term }}"
                                placeholder="e.g. Enterprise Architecture"
                                autocomplete="off"
                                required
                            >
                        </div>

                        <div class="field definition-field">
                            <label for="id_definition">Definition</label>
                            <textarea
                                id="id_definition"
                                name="definition"
                                placeholder="Write the definition in your own words..."
                                required
                            >{{ definition.definition }}</textarea>
                        </div>

                        <input
                            type="hidden"
                            name="difficulty"
                            value="{{ definition.knowledge_unit.difficulty }}"
                        >

                        <input
                            type="hidden"
                            name="estimated_minutes"
                            value="{{ definition.knowledge_unit.estimated_minutes }}"
                        >

                    </div>

                    <div class="form-footer">
                        <a
                            href="{% url 'definition_list' subject_id=subject.id %}"
                            class="cancel-button"
                        >
                            Cancel
                        </a>

                        <button type="submit" class="save-button">
                            Save Changes
                        </button>
                    </div>
                </form>

            </section>

        </div>

    </main>

</div>

<script src="{% static 'dashboard/js/sidebar.js' %}"></script>

</body>

</html>
