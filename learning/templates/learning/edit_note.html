{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Edit {{ note.title }} - StudyOptimizer
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            padding:
                35px
                20px
                60px;

            background: #f5f6f8;

            color: #222;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

        }


        .page {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

        }


        /* =========================================
           HEADER
        ========================================= */

        .page-header {

            display: flex;

            align-items: flex-start;

            gap: 15px;

            margin-bottom: 25px;

        }


        .back-button {

            width: 42px;

            height: 42px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                1px solid
                #dcdcdc;

            border-radius: 9px;

            background: white;

            color: #333;

            text-decoration: none;

            font-size: 20px;

        }


        .back-button:hover {

            background: #f0f0f0;

        }


        .page-header h1 {

            margin:
                0
                0
                5px;

            font-size: 29px;

        }


        .page-header p {

            margin: 0;

            color: #777;

            font-size: 13px;

        }


        /* =========================================
           CARD
        ========================================= */

        .note-card {

            padding: 30px;

            border:
                1px solid
                #e2e2e2;

            border-radius: 14px;

            background: white;

        }


        /* =========================================
           ERROR
        ========================================= */

        .error-message {

            margin-bottom: 20px;

            padding:
                12px
                14px;

            border:
                1px solid
                #e4bcbc;

            border-radius: 8px;

            background: #fff4f4;

            color: #963c3c;

            font-size: 13px;

            font-weight: 600;

        }


        /* =========================================
           FIELDS
        ========================================= */

        .field {

            display: flex;

            flex-direction: column;

            gap: 8px;

            margin-bottom: 22px;

        }


        .field label {

            color: #444;

            font-size: 13px;

            font-weight: 700;

        }


        .field-help {

            margin-top: -3px;

            color: #999;

            font-size: 11px;

        }


        .field input,
        .field select,
        .field textarea {

            width: 100%;

            border:
                1px solid
                #d8d8d8;

            border-radius: 9px;

            background: white;

            color: #222;

            font-family: inherit;

            font-size: 15px;

            outline: none;

        }


        .field input,
        .field select {

            height: 46px;

            padding:
                0
                13px;

        }


        .field textarea {

            min-height: 380px;

            padding: 15px;

            resize: vertical;

            line-height: 1.6;

        }


        .field input:focus,
        .field select:focus,
        .field textarea:focus {

            border-color: #555;

            box-shadow:
                0
                0
                0
                3px
                rgba(
                    0,
                    0,
                    0,
                    0.04
                );

        }


        /* =========================================
           OPTIONAL DETAILS
        ========================================= */

        .additional-details {

            padding-top: 22px;

            border-top:
                1px solid
                #eeeeee;

        }


        .additional-heading {

            margin-bottom: 18px;

        }


        .additional-heading h2 {

            margin:
                0
                0
                4px;

            font-size: 17px;

        }


        .additional-heading p {

            margin: 0;

            color: #888;

            font-size: 12px;

        }


        .details-grid {

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            gap: 18px;

        }


        /* =========================================
           ACTIONS
        ========================================= */

        .actions {

            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 8px;

            padding-top: 22px;

            border-top:
                1px solid
                #eeeeee;

        }


        .cancel-button {

            min-width: 110px;

            padding:
                12px
                18px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            border:
                1px solid
                #d8d8d8;

            border-radius: 8px;

            background: white;

            color: #444;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

        }


        .cancel-button:hover {

            background: #f5f5f5;

        }


        .save-button {

            min-width: 140px;

            padding:
                12px
                20px;

            border: none;

            border-radius: 8px;

            background: #222;

            color: white;

            font-family: inherit;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

        }


        .save-button:hover {

            background: #333;

        }


        @media (max-width: 650px) {

            .note-card {

                padding: 22px;

            }


            .details-grid {

                grid-template-columns:
                    1fr;

                gap: 0;

            }


            .actions {

                flex-direction:
                    column-reverse;

            }


            .cancel-button,
            .save-button {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<div class="page">


    <header class="page-header">


        <a
            href="{% url 'note_detail' note_id=note.id %}"
            class="back-button"
        >
            ←
        </a>


        <div>


            <h1>
                Edit Note
            </h1>


            <p>
                {{ subject.name }}
            </p>


        </div>


    </header>


    <div class="note-card">


        {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

        {% endif %}


        <form method="post">


            {% csrf_token %}


            <!-- =================================
                 TITLE
            ================================== -->

            <div class="field">


                <label for="note-title">
                    Note Name
                </label>


                <input
                    id="note-title"
                    type="text"
                    name="title"
                    value="{{ title }}"
                    maxlength="255"
                    required
                >


            </div>


            <!-- =================================
                 CONTENT
            ================================== -->

            <div class="field">


                <label for="note-content">
                    Notes
                </label>


                <textarea
                    id="note-content"
                    name="content"
                    required
                >{{ content }}</textarea>


            </div>


            <!-- =================================
                 OPTIONAL DETAILS
            ================================== -->

            <div class="additional-details">


                <div class="additional-heading">


                    <h2>
                        Additional Details
                    </h2>


                    <p>
                        Optionally link the note to a textbook and chapter.
                    </p>


                </div>


                <div class="details-grid">


                    <div class="field">


                        <label for="book-name">
                            Textbook
                        </label>


                        <select
                            id="book-name"
                            name="book_name"
                        >


                            <option value="">
                                No textbook
                            </option>


                            {% for textbook in textbooks %}

                                <option
                                    value="{{ textbook.name }}"
                                    {% if selected_book == textbook.name %}
                                        selected
                                    {% endif %}
                                >
                                    {{ textbook.name }}
                                </option>

                            {% endfor %}


                        </select>


                    </div>


                    <div class="field">


                        <label for="chapter">
                            Chapter
                        </label>


                        <input
                            id="chapter"
                            type="text"
                            name="chapter"
                            value="{{ chapter }}"
                            maxlength="255"
                            placeholder="e.g. Chapter 6"
                        >


                    </div>


                </div>


            </div>


            <div class="actions">


                <a
                    href="{% url 'note_detail' note_id=note.id %}"
                    class="cancel-button"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    class="save-button"
                >
                    Save Changes
                </button>


            </div>


        </form>


    </div>


</div>


</body>

</html>
