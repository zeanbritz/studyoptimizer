{% load static %}
<section id="demo-panel-today" class="demo-panel" role="tabpanel" aria-labelledby="demo-tab-today" data-demo-panel="today">
    <div class="demo-panel__heading">
        <div><span class="demo-panel__eyebrow">Your day at a glance</span><h3>Today's plan</h3></div>
        <span class="demo-panel__date">Real screen</span>
    </div>
    <p class="demo-panel__intro">Open your dashboard and see the work that needs your attention today.</p>
    <a class="product-shot" href="{% static 'landing/images/product-todays-plan.jpg' %}" target="_blank" rel="noopener" aria-label="Open the Today's Plan screenshot at full size in a new tab">
        <img src="{% static 'landing/images/product-todays-plan.jpg' %}" alt="StudiGarden dashboard showing today's review and study items" width="1390" height="795" loading="lazy">
    </a>
    <p class="product-shot__caption">Today's Plan <span>Open image for a closer look</span></p>
</section>
