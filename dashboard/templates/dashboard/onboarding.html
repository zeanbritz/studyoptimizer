<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Get Started - StudyOptimizer</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6f8;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 30px;
        }

        .progress {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 14px;
            padding: 40px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 30px;
            color: #777;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d8d8d8;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #222;
        }

        .button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .button:hover {
            background: #333;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="progress">
        Step 1 of 5
    </div>

    <div class="card">

        <h1>
            Let's get you set up.
        </h1>

        <p class="subtitle">
            We'll use this information to build
            your personalized study plan.
        </p>

        <form method="POST">

            {% csrf_token %}

            <label>
                What qualification are you studying?
            </label>

            <input
                type="text"
                name="qualification"
                placeholder="e.g. B.Comm"
                required
            >

            <label style="margin-top: 25px;">
                What is the name of your qualification?
            </label>

            <input
                type="text"
                name="qualification_name"
                placeholder="e.g. Business Informatics"
                required
            >

            <label style="margin-top: 25px;">
                How many subjects do you have?
            </label>

            <input
                type="number"
                name="subject_count"
                min="1"
                max="30"
                placeholder="e.g. 6"
                required
            >

            <label style="margin-top: 25px;">
                What overall grade are you targeting?
            </label>

            <select
                name="target_grade"
                required
            >

                <option value="">
                    Select a target
                </option>

                <option value="50">
                    50%
                </option>

                <option value="60">
                    60%
                </option>

                <option value="70">
                    70%
                </option>

                <option value="75">
                    75%
                </option>

                <option value="80">
                    80%
                </option>

                <option value="90">
                    90%
                </option>

                <option value="95">
                    95%
                </option>

            </select>

            <label style="margin-top: 25px;">
                How many hours can you study per week?
            </label>

            <input
                type="number"
                name="study_hours"
                min="1"
                max="168"
                placeholder="e.g. 15"
                required
            >

            <button
                type="submit"
                class="button"
            >
                Continue →
            </button>

        </form>

    </div>

</div>

</body>

</html>
