<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Definitions - {{ subject.name }}
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f6f8;
            color: #222;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        .page {
            min-height: 100vh;
            padding: 35px 40px 50px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 30px;
        }

        .back-button {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #dedede;
            border-radius: 9px;

            background: white;
            color: #333;

            text-decoration: none;
            font-size: 20px;
        }

        .back-button:hover {
            background: #f0f0f0;
        }

        .header h1 {
            margin: 0 0 4px;
            font-size: 30px;
        }

        .header p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .content {
            max-width: 900px;
        }

        .add-definition {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 14px;
            padding: 28px;
            margin-bottom: 25px;
        }

        .add-definition h2 {
            margin: 0 0 6px;
            font-size: 21px;
        }

        .add-definition p {
            margin: 0 0 22px;
            color: #888;
            font-size: 14px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        .field input,
        .field textarea {
            width: 100%;

            padding: 12px 13px;

            border: 1px solid #d8d8d8;
            border-radius: 8px;

            background: white;

            font-family: inherit;
            font-size: 15px;

            outline: none;
        }

        .field textarea {
            min-height: 120px;
            resize: vertical;
        }

        .field input:focus,
        .field textarea:focus {
            border-color: #222;
        }

        .save-button {
            border: none;
            border-radius: 8px;

            background: #222;
            color: white;

            padding: 12px 22px;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
        }

        .save-button:hover {
            background: #333;
        }

        .definitions {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 14px;
            padding: 28px;
        }

        .definitions h2 {
            margin: 0 0 20px;
            font-size: 21px;
        }

        .definition-item {
            padding: 18px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .definition-item:first-child {
            padding-top: 0;
        }

        .definition-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .definition-term {
            margin: 0 0 7px;
            font-size: 16px;
            font-weight: 700;
        }

        .definition-meaning {
            margin: 0;
            color: #666;
            line-height: 1.6;
            font-size: 14px;
        }

        .empty {
            min-height: 140px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px dashed #d5d5d5;
            border-radius: 10px;

            color: #888;
            text-align: center;
        }

        @media (max-width: 700px) {

            .page {
                padding: 25px 20px 40px;
            }

        }

    </style>

</head>


<body>


<div class="page">


    <header class="header">

        <a
            href="{% url 'subject_detail' subject_index=subject_index %}"
            class="back-button"
        >
            ←
        </a>

        <div>

            <h1>
                Definitions
            </h1>

            <p>
                {{ subject.name }}
            </p>

        </div>

    </header>


    <div class="content">


        <!-- ADD DEFINITION -->

        <section class="add-definition">

            <h2>
                Add Definition
            </h2>

            <p>
                Add a concept and define it in your own words.
            </p>


            <form method="POST">

                {% csrf_token %}


                <div class="field">

                    <label>
                        Term
                    </label>

                    <input
                        type="text"
                        name="term"
                        placeholder="e.g. Enterprise Architecture"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Definition
                    </label>

                    <textarea
                        name="meaning"
                        placeholder="Write the definition in your own words..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="save-button"
                >
                    Save Definition
                </button>

            </form>

        </section>


        <!-- SAVED DEFINITIONS -->

        <section class="definitions">

            <h2>
                Saved Definitions
            </h2>


            {% if definitions %}

                {% for item in definitions %}

                    <div class="definition-item">

                        <h3 class="definition-term">
                            {{ item.term }}
                        </h3>

                        <p class="definition-meaning">
                            {{ item.meaning }}
                        </p>

                    </div>

                {% endfor %}

            {% else %}

                <div class="empty">

                    No definitions have been added yet.

                </div>

            {% endif %}


        </section>


    </div>


</div>


</body>

</html>
