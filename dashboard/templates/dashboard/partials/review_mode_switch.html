<nav class="mode-switch" aria-label="{{ item_label }} mode">
    <a href="{% url list_url_name %}?mode=review" {% if mode == 'review' %}aria-current="page"{% endif %}>Review</a>
    <a href="{% url list_url_name %}?mode=test" {% if mode == 'test' %}aria-current="page"{% endif %}>Test</a>
</nav>
<p class="mode-help">
    {% if mode == 'test' %}{{ test_help }}{% else %}Open and read {{ item_label }} at your own pace. Review does not change your progress.{% endif %}
</p>
