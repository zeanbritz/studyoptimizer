<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Subject - StudyOptimizer</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f5f6f8;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            color: #222;
        }

        .container {
            width: 100%;

            max-width: 600px;

            padding: 30px;
        }

        .back {
            display: inline-block;

            margin-bottom: 20px;

            color: #666;

            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            color: #222;
        }

        .card {
            background: white;

            border: 1px solid #e5e5e5;

            border-radius: 14px;

            padding: 40px;
        }

        h1 {
            margin: 0 0 8px;

            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 30px;

            color: #777;

            line-height: 1.5;
        }

        label {
            display: block;

            font-weight: 600;

            margin-bottom: 9px;
        }

        input,
        select {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d8d8d8;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #222;
        }

        .field {
            margin-bottom: 22px;
        }

        .button {
            width: 100%;

            margin-top: 8px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #222;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;
        }

        .button:hover {
            background: #333;
        }

    </style>

</head>

<body>

<div class="container">

    <a
        href="{% url 'goals' %}"
        class="back"
    >
        ← Goals
    </a>


    <div class="card">

        <h1>
            Subject {{ subject_index|add:"1" }}
        </h1>

        <p class="subtitle">
            Set the details and academic targets for this subject.
        </p>


        <form method="POST">

            {% csrf_token %}


            <div class="field">

                <label>
                    Subject name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ subject.name }}"
                    placeholder="e.g. Financial Management"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Target grade
                </label>

                <select
                    name="target_grade"
                    required
                >

                    <option value="">
                        Select a target
                    </option>

                    <option
                        value="50"
                        {% if subject.target_grade == "50" %}selected{% endif %}
                    >
                        50%
                    </option>

                    <option
                        value="60"
                        {% if subject.target_grade == "60" %}selected{% endif %}
                    >
                        60%
                    </option>

                    <option
                        value="70"
                        {% if subject.target_grade == "70" %}selected{% endif %}
                    >
                        70%
                    </option>

                    <option
                        value="75"
                        {% if subject.target_grade == "75" %}selected{% endif %}
                    >
                        75%
                    </option>

                    <option
                        value="80"
                        {% if subject.target_grade == "80" %}selected{% endif %}
                    >
                        80%
                    </option>

                    <option
                        value="85"
                        {% if subject.target_grade == "85" %}selected{% endif %}
                    >
                        85%
                    </option>

                    <option
                        value="90"
                        {% if subject.target_grade == "90" %}selected{% endif %}
                    >
                        90%
                    </option>

                    <option
                        value="95"
                        {% if subject.target_grade == "95" %}selected{% endif %}
                    >
                        95%
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    Exam date
                </label>

                <input
                    type="date"
                    name="exam_date"
                    value="{{ subject.exam_date }}"
                >

            </div>


            <button
                type="submit"
                class="button"
            >
                Save Subject
            </button>

        </form>

    </div>

</div>

</body>

</html>
