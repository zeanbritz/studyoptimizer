<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Definitions - StudyOptimizer
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #f5f6f8;

            color: #222;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

        }


        .container {

            max-width: 1000px;

            margin: 0 auto;

            padding: 50px 30px;

        }


        .back {

            display: inline-block;

            margin-bottom: 25px;

            color: #666;

            text-decoration: none;

            font-size: 14px;

        }


        .back:hover {

            color: #222;

        }


        .header {

            margin-bottom: 30px;

        }


        .header h1 {

            margin: 0 0 8px;

            font-size: 32px;

        }


        .header p {

            margin: 0;

            color: #777;

        }


        .definition-box {

            background: white;

            border: 1px solid #e5e5e5;

            border-radius: 12px;

            padding: 25px;

            margin-bottom: 20px;

        }


        .definition-box h2 {

            margin: 0 0 20px;

            font-size: 20px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

        }


        input,
        textarea {

            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d8d8d8;

            border-radius: 8px;

            font-family: inherit;

            font-size: 15px;

            outline: none;

        }


        input:focus,
        textarea:focus {

            border-color: #222;

        }


        textarea {

            min-height: 140px;

            resize: vertical;

        }


        .button {

            margin-top: 20px;

            padding: 12px 22px;

            border: none;

            border-radius: 8px;

            background: #222;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

        }


        .button:hover {

            background: #333;

        }

    </style>

</head>


<body>


<div class="container">


    <a
        href="{% url 'subject_detail' subject_index=subject_index %}"
        class="back"
    >
        ← Back to {{ subject.name|default:"Subject" }}
    </a>


    <div class="header">

        <h1>
            Definitions
        </h1>

        <p>
            {{ subject.name|default:"Your subject" }}
        </p>

    </div>


    <div class="definition-box">

        <h2>
            Add a definition
        </h2>


        <form method="POST">

            {% csrf_token %}


            <label>
                Term
            </label>

            <input
                type="text"
                name="term"
                placeholder="e.g. Enterprise Architecture"
                required
            >


            <label style="margin-top: 20px;">

                Definition

            </label>

            <textarea
                name="definition"
                placeholder="Write the definition..."
                required
            ></textarea>


            <button
                type="submit"
                class="button"
            >
                Save Definition
            </button>


        </form>

    </div>


</div>


</body>

</html>
